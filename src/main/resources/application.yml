spring:
  application:
    name: nyangtech-backend

  datasource:
    url: jdbc:h2:mem:nyangtech
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    # 요청 처리가 끝난 뒤(화면 렌더링 단계)에는 DB에 접근하지 않는다. 지연 로딩 쿼리가 몰래 나가는 것을 막는다.
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          # 테이블 생성이 실패하면 경고만 남기고 넘어가지 않고 앱을 바로 멈춘다. (예약어 오타 같은 실수를 즉시 발견)
          halt_on_error: true

  h2:
    console:
      enabled: true
      path: /h2-console